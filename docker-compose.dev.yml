services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kneresz
      POSTGRES_PASSWORD: kneresz
      POSTGRES_DB: kneresz
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      - db

volumes:
  pgdata-dev:
