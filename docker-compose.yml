services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kneresz
      POSTGRES_PASSWORD: kneresz
      POSTGRES_DB: kneresz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    expose:
      - "8000"
    env_file: .env
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for Cloudflare origin certificate (Full Strict mode):
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
