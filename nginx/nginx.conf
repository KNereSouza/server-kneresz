server {
    listen 80;
    server_name api.kneresz.com;

    # --- Cloudflare Full (Strict) mode ---
    # Uncomment the lines below and comment out "listen 80" above
    # to serve HTTPS with a Cloudflare origin certificate.
    #
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/origin.pem;
    # ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    location / {
        proxy_pass http://api:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Disable buffering for streaming/SSE if needed
        proxy_buffering off;
    }

    # Health check shortcut
    location = /health {
        proxy_pass http://api:8000/health;
    }
}
